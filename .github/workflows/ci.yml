name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile, test and render examples
        run: ./build.ps1 -RunTests -RenderGallery
      - name: Upload experimental installer
        uses: actions/upload-artifact@v7
        with:
          name: MelloCharts-Windows-${{ github.sha }}
          path: |
            release/MelloCharts-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
